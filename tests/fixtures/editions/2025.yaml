# Выпуск 2025 — «ЮБИЛЕЙНАЯ ЗАРУБА 2025», первый двухдневный формат.
#
# Подтверждено публичными источниками (docs/01-research.md §1.6.8):
#   * даты 6–7 декабря, КТЗ «Золотые ворота Сибири», ценз 6+ — «Кассы Ру»
#     до 18.11.2026 (позже страницу переиспользовали под выпуск 2026);
#   * деление дней: 6 декабря — соло и дуэты, 7 декабря — команды и мини-группы
#     (пост сообщества 207 от 09.10.2025);
#   * 21 реальная номинация — из официальной папки «Судейские листы Заруба 2025»
#     (Яндекс.Диск, опубликована 8 декабря 2025): 9 в первый день, 12 во второй;
#   * жюри — Анастасия Юрасова (MATÈ), Андрей Морыженков, Наталья Мафия; MC — GEO.
#
# Чего здесь нет и почему:
#   * тайминга блоков и списков участников текстом — организаторы выложили их
#     картинками (посты 213, 215, 216), имена с фото без согласий не набираем;
#   * мест и баллов — протокол не публиковался: судейские листы выложены
#     фотографиями, таблицы результатов нет;
#   * цены билета числом — в посте 211 была «проходка в зрительский зал без места».
#
# Номинации с `demo: true` и связанные с ними студии, участники и выступления —
# каркас страниц каталога, а не факты выпуска: в архивный список на /history
# они не попадают и уступают место реальным данным, когда появятся согласия.
