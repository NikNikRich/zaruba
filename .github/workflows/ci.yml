name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка
        # Версии и хеши — из лока: тесты идут на том же наборе, что попадёт в образ,
        # а `--require-hashes` не даст поставить подменённый пакет.
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Лок зависимостей не устарел
        # pyproject изменили, а лок не пересобрали — сборка образа и тесты
        # разъедутся. Проверка ловит это до ревью.
        run: |
          python -m uv pip compile --universal --generate-hashes -o requirements.lock pyproject.toml
          python -m uv pip compile --universal --generate-hashes --extra dev -o requirements-dev.lock pyproject.toml
          # Сравниваем только пины и хеши. Комментарии `# via` и шапку команды uv
          # пишет по-разному на Linux-раннере и на Windows, где лок собирают:
          # `git diff` падал на строке `#   starlette`, которую нельзя исправить
          # осмысленно, а сборку ломает только расхождение версий и хешей.
          for f in requirements.lock requirements-dev.lock; do
            git show "HEAD:$f" | grep -vE '^[[:space:]]*#' | grep -vE '^[[:space:]]*$' > "/tmp/$f.head"
            grep -vE '^[[:space:]]*#' "$f" | grep -vE '^[[:space:]]*$' > "/tmp/$f.new"
            if ! diff -u "/tmp/$f.head" "/tmp/$f.new"; then
              echo "::error::$f расходится с pyproject.toml — пересоберите лок: python -m uv pip compile --universal --generate-hashes -o $f pyproject.toml"
              exit 1
            fi
          done

      - name: Линт
        run: python -m ruff check src tests

      - name: Форматирование
        run: python -m ruff format --check src tests

      - name: Типы
        run: python -m mypy

      - name: Тесты и покрытие
        # Порог покрытия задан в pyproject.toml ([tool.coverage.report]) и
        # проверяется здесь, а не отдельной командой.
        run: python -m pytest -q --cov=zaruba --cov-report=term-missing

      - name: Контент выпусков
        run: python -m zaruba.content check

      - name: Синтаксис скриптов
        # smoke.sh запускают на сервере после выкладки, setup_vps.sh — на чистом
        # VPS: bash -n ловит опечатку и CRLF в файле до того, как скрипт
        # понадобится в аварии.
        run: |
          bash -n deploy/smoke.sh
          bash -n deploy/setup_vps.sh

      - name: Документы
        run: |
          python tools/check_md_tables.py
          python tools/check_md_chars.py
          python tools/check_html.py

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка
        run: python -m pip install pip-audit

      - name: Аудит зависимостей
        # Отдельная задача: уязвимость в зависимости не должна мешать
        # прогону тестов, но и молча ждать ревью она не должна.
        run: python -m pip_audit -r requirements.lock --strict

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Compose-файл валиден
        # DOMAIN обязателен для caddy, поэтому подставляем фиктивный: проверяем
        # синтаксис и тома, а не выпуск сертификата.
        run: |
          { cat .env.example; printf 'DOMAIN=example.test\n'; } > .env
          docker compose config --quiet

      - name: Сборка образа
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: zaruba:ci

      - name: Проверка контейнера
        run: |
          docker run -d --name zaruba -p 8000:8000 zaruba:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8000/privacy | grep -qx 200
          curl -fsS -D - -o /dev/null http://127.0.0.1:8000/ | grep -qi 'content-security-policy'
          curl -fsS -D - -o /dev/null -H 'X-Request-ID: ci-trace-0001' http://127.0.0.1:8000/ \
            | grep -qi 'x-request-id: ci-trace-0001'
          docker rm -f zaruba

