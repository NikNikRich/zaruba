name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка
        run: python -m pip install -e ".[dev]"

      - name: Линт
        run: python -m ruff check src tests

      - name: Форматирование
        run: python -m ruff format --check src tests

      - name: Тесты
        run: python -m pytest -q

      - name: Контент выпусков
        run: python -m zaruba.content check

      - name: Документы
        run: |
          python tools/check_md_tables.py
          python tools/check_md_chars.py
          python tools/check_html.py

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Сборка образа
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: zaruba:ci

      - name: Проверка контейнера
        run: |
          docker run -d --name zaruba -p 8000:8000 zaruba:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8000/privacy | grep -qx 200
          curl -fsS -D - -o /dev/null http://127.0.0.1:8000/ | grep -qi 'content-security-policy'
          docker rm -f zaruba
