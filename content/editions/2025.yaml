# Выпуск 2025 — «ЮБИЛЕЙНАЯ ЗАРУБА 2025», первый двухдневный формат.
#
# Подтверждено публичными источниками (docs/01-research.md §1.6.8):
#   * даты 6–7 декабря и КТЗ «Золотые ворота Сибири» — «Кассы Ру» до 18.11.2026;
#     ценз 6+ взят с той же афиши на момент сверки и отдельно не перепроверяется:
#     к ноябрю 2026 организатор переиспользовал страницу события под выпуск 2026;
#   * деление дней: 6 декабря — соло и дуэты, 7 декабря — команды и мини-группы
#     (пост сообщества 207 от 09.10.2025);
#   * 21 реальная номинация — из официальной папки «Судейские листы Заруба 2025»
#     (Яндекс.Диск, файлы загружены 09.12.2025): 9 в первый день, 12 во второй;
#   * жюри — Анастасия Юрасова (MATÈ), Андрей Морыженков, Наталья Мафия; MC — GEO
#     (тот же пост 207).
#
# Чего здесь нет и почему:
#   * тайминга блоков и списков участников текстом нет: организаторы выложили их
#     картинками (посты 213 «тайминг», 215/216 «СПИСКИ 6 и 7 ДЕКАБРЯ»). Имена с
#     фотографий без согласий не набираем, поэтому в YAML их нет — но и писать
#     «не публиковались» нельзя, они опубликованы, только не текстом;
#   * мест и баллов — протокол не публиковался: судейские листы выложены
#     фотографиями, таблицы результатов нет;
#   * цены билета числом нет: в посте 211 продавалась «проходка в зрительский
#     зал без места» со ссылкой на кассу, суммы в тексте поста нет.
#
# Демонстрационный каркас каталога (студии, участники, выступления и блоки) сюда
# не входит: он живёт в `tests/fixtures/editions/2025.yaml`. Публикуются только
# подтверждённые 21 номинация и жюри.
edition: 2025
title: ЮБИЛЕЙНАЯ ЗАРУБА 2025
dates: ["2025-12-06", "2025-12-07"]
venue: zolotye-vorota
status: confirmed
timezone: Asia/Yekaterinburg
# Ценз 6+ — с афиши «Касс Ру» на момент сверки 25.10.2026; к 18.11.2026 та же
# страница открывает выпуск 2026, поэтому для 2025 ценз отдельно не
# перепроверяется и в карточке года не выводится.
age_rating: "6+"
updated_at: "2026-11-17T12:00:00+05:00"
note: >-
  Юбилейный выпуск и первый двухдневный формат: 6 декабря — соло и дуэты,
  7 декабря — команды и мини-группы; 21 номинация.

