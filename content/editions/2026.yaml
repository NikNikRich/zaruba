# Критерии из «Положения»: четыре шкалы по 0–10 и одна по 0–5.
# Для соло пятая строка в PDF не подписана — поэтому applies_to только у команд.
criteria:
  - title: Сложность хореографии
    max_score: 10
  - title: Техничность и синхронность
    max_score: 10
    applies_to: все номинации, кроме соло
  - title: Креативность
    max_score: 10
    applies_to: все номинации, кроме соло
  - title: Зрелищность
    max_score: 10
    applies_to: все номинации, кроме соло
  - title: Внешний вид
    max_score: 5
    applies_to: все номинации, кроме соло

rules:
  - 'Хронометраж: команды — до 4:00, дуэты — до 2:00, соло — до 1:30. Превышение больше чем на 10 секунд по согласованию — минус 5 баллов.'
  - 'Фонограмма: MP3 или WAV на zaruba72champ@mail.ru до 07.12.2026, имя файла «номинация_команда.mp3»; с собой — флешка с треком.'
  - 'Без фонограммы в срок возможна дисквалификация без возврата взноса.'
  - 'Реквизит согласуют не позднее чем за неделю. Запрещены открытый огонь, пиротехника, оружие, животные, кремы, краски и блёстки на покрытии.'
  - 'В детских номинациях участники предъявляют документы; не более 20 % команды могут не подходить по возрасту.'
  - 'Возврат взноса — до окончания регистрации, то есть до 07.12.2026.'
  - 'Каждый участник получает памятный диплом в электронном виде.'

