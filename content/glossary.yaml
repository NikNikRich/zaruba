# Глоссарий (`docs/06` §6.15): девять направлений из `docs/03` + термины чемпионата.
# Это общие определения стилей, а не факты о конкретном выпуске: они не требуют
# источника события, но и не описывают то, чего мы не знаем про «Зарубу».
entries:
  - slug: hip-hop
    kind: style
    style: hip-hop
    term: Hip-Hop
    what: >-
      Уличный стиль на основе грува: корпус работает низко, движения «качаются»
      вместе с битом. Здесь ценится музыкальность и чистота ритма больше, чем
      эффектный трюк.
    signs:
      - Пружинистый кач корпуса на каждый бит.
      - Акцент на ритме, а не на растяжке и трюках.
      - Импровизация и баттлы — часть культуры стиля.
    example: Трек с чётким битом 90–110 BPM; базовое движение — bounce.

  - slug: heels-girly
    kind: style
    style: heels-girly
    term: Heels / Girly
    what: >-
      Направление, которое танцуют на каблуках: подчёркнутая линия ноги, контроль
      корпуса и уверенная подача. Girly — более мягкая версия той же техники,
      без обязательных каблуков.
    signs:
      - Работа на каблуках, акцент на линии ног.
      - Много поз и остановок «в кадре».
      - Подача и взгляд — часть хореографии, а не добавка.
    example: Медленный R&B или pop с внятным битом.

  - slug: jazz-funk
    kind: style
    style: jazz-funk
    term: Jazz-Funk
    what: >-
      Смесь джазовой техники и уличного грува: чёткие линии рук, синкопы и
      «выстрелы» корпусом. Чаще танцуется в командах и мини-группах, где важна
      синхронность.
    signs:
      - Резкие акценты руками и корпусом.
      - Синхронность состава важнее сольной импровизации.
      - Джазовая пластика поверх фанкового ритма.
    example: Funk или pop с частыми синкопами.

  - slug: contemporary
    kind: style
    style: contemporary
    term: Contemporary
    what: >-
      Современный сценический танец, где главное — смысл и дыхание, а не набор
      элементов. Движение может быть медленным и неудобным, если так передаётся
      история.
    signs:
      - Работа с весом, падениями и полом.
      - Дыхание и паузы — часть номера.
      - Часто есть сюжет или образ, а не только техника.
    example: Спокойная авторская музыка без ровного танцевального бита.

  - slug: k-pop
    kind: style
    style: k-pop
    term: K-Pop
    what: >-
      Хореография под корейские поп-хиты: короткие «точки», узнаваемые жесты
      руками и обязательная синхронность. Стиль вырос из кавер-команд, поэтому
      образ и подача здесь не менее важны, чем техника.
    signs:
      - Жесты руками и «фирменные» движения припева.
      - Плотная синхронность состава.
      - Мимика и образ наравне с движением.
    example: Припев популярного K-pop трека.

  - slug: experimental
    kind: style
    style: experimental
    term: Experimental
    what: >-
      Направление без готового словаря: танцор смешивает стили или придумывает
      движение сам. Оценивают идею и её воплощение, а не соответствие канону.
    signs:
      - Неожиданные сочетания стилей в одном номере.
      - Своя лексика движения, которую не повторить по видео.
      - Сильный образ или концепция.
    example: Нестандартный трек или звуковой коллаж.

  - slug: breaking
    kind: style
    style: breaking
    term: Breaking
    what: >-
      Спортивный уличный стиль: топроки, футворк, фризы и силовые элементы на
      полу. В баттле важны музыкальность, чистота элементов и умение отвечать
      сопернику.
    signs:
      - "Работа на полу: фризы, футворк, пауэр-мувы."
      - Баттл-формат один на один.
      - Музыкальность при высокой сложности элементов.
    example: Breakbeat — классическая основа для брейкинга.

  - slug: waacking-vogue
    kind: style
    style: waacking-vogue
    term: Waacking / Vogue
    what: >-
      Стиль рук и подачи из клубной культуры: быстрые вращения рук, позы и
      «камерный» взгляд. Waacking держится на музыкальности и ритме рук, vogue
      добавляет позы и проходку.
    signs:
      - Быстрая работа рук над головой и в сторону.
      - Позы и «стоп-кадры» в духе съёмки.
      - Яркая подача, чаще всего под диско.
    example: Disco или house с быстрым темпом.

  - slug: dancehall
    kind: style
    style: dancehall
    term: Dancehall
    what: >-
      Ямайский уличный стиль с глубоким грувом и работой бёдрами. Движения
      привязаны к ритму «бати» и часто повторяются как короткие связки.
    signs:
      - Глубокий грув и активная работа бёдрами.
      - Повторяющиеся связки под ритм.
      - Энергия и вовлечённость всего корпуса.
    example: Dancehall-ритм 95–110 BPM.

  - slug: nominaciya
    kind: term
    term: Номинация
    what: >-
      Категория внутри чемпионата: направление, формат и возрастная группа
      вместе. Один участник может выйти в нескольких номинациях, если это
      разрешено «Положением».
    signs:
      - Указана в расписании вместе с днём и временем.
      - У каждой номинации своя сетка участников.

  - slug: trek
    kind: term
    term: Трек
    what: >-
      Музыка, под которую идёт выступление. Трек сдаётся заранее по правилам
      организатора, а его длительность ограничена регламентом.
    signs:
      - Длительность ограничена «Положением».
      - Трек сдают до события, а не приносят на флешке в день блока.

  - slug: battl
    kind: term
    term: Баттл
    what: >-
      Формат, где танцоры выходят друг против друга и отвечают на выход
      соперника. Победителя определяют судьи, а не голосование зала.
    signs:
      - Пара выходов по очереди.
      - Решение принимают судьи по объявленным критериям.

  - slug: duet
    kind: term
    term: Дуэт
    what: >-
      Выступление двух участников: хореография строится на взаимодействии, а не
      на двух сольных партиях рядом.
    signs:
      - Два человека в заявке.
      - Взаимодействие и поддержки — часть номера.

  - slug: mini-gruppa
    kind: term
    term: Мини-группа
    what: >-
      Небольшой состав, обычно от трёх до семи человек. Здесь важна синхронность,
      но номер ещё можно построить на индивидуальностях.
    signs:
      - Состав меньше команды.
      - Синхронность и рисунок важнее сольных вставок.

  - slug: shou
    kind: term
    term: Шоу
    what: >-
      Постановочный номер с идеей, костюмами и реквизитом. Оценивают целостность
      образа и режиссуру, а не только технику движения.
    signs:
      - Есть сюжет или образ, а не только связка.
      - Номер дольше соло и требует реквизита или костюма.

  - slug: vznos
    kind: term
    term: Взнос
    what: >-
      Организационный взнос участника за заявку. Размер, льготы и правила
      возврата определяет организатор, а не этот сайт.
    signs:
      - Размер и возврат — только из «Положения».
      - На этом сайте взносы не принимаются.

  - slug: zherebyovka
    kind: term
    term: Жеребьёвка
    what: >-
      Распределение порядка выступлений внутри номинации. От него зависит, во
      сколько участнику выходить и когда приходить на площадку.
    signs:
      - Порядок объявляют до начала блока.
      - Порядок может измениться, если участник не явился.


