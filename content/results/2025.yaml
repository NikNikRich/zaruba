- 'Место — расчёт по судейским листам: официального протокола с местами и баллами организаторы не публиковали.'
- Балл судьи — сумма пяти критериев листа. Звёздочка значит, что напечатанный на листе «общий балл» с
  суммой не сошёлся.
- '«н/ч» — цифра не читается: участник выпадает из рейтинга, остальные места сохраняют.'
- '«—» — листа этого судьи нет в источнике: в такой номинации места не присваиваются никому.'
- 'В детских номинациях (соло и дуэты до 18) фамилий нет: только инициалы или сценическое имя — согласий на публикацию данных детей у проекта нет.'
