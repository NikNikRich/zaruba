# Фотоархив для страницы /history (`docs/06` §6.5).
#
# Оснований публикации два, и они не смешиваются:
#   1) свои права — кадр наш или есть разрешение автора (`license`);
#   2) цитирование по п. 1 ст. 1274 ГК РФ — `use: citation` + `purpose`
#      (информационная, научная, учебная или культурная цель) + имя автора
#      и источник заимствования (`source`).
# Цитата без цели, автора или источника не загрузится — валидатор упадёт.
# `/takedown` при этом остаётся в силе: законное цитирование не отменяет
# просьбу «уберите» и наши 48 часов.
#
# Пока файла нет, карточка — превью-заглушка со ссылкой на публикацию:
# посетитель видит, что снимки существуют и где они лежат.
#
# Свой снимок добавляется в три шага (подробности — README, раздел «Фото»):
#   1) положить исходник в `assets/photos/history/`;
#   2) запустить `python tools/prepare_photos.py --preset gallery`;
#   3) дописать в карточку `file`, `alt`, `author`, `license` — без них
#      загрузка YAML падает, и это намеренно.
#
# Пример карточки с файлом:
#   - slug: 2024-stage
#     year: 2024
#     title: «ЗАРУБА 2024» — сцена
#     caption: Второй блок 8 декабря: выход на сцену и судейский стол.
#     kind: gallery
#     file: img/history/2024-stage.webp
#     alt: Танцоры на сцене во время блока «ЗАРУБА 2024»
#     author: Имя Фотографа
#     license: разрешение организаторов
#     source:
#       id: vk-community
#       title: Сообщество «ЗАРУБА72» во ВКонтакте
#       url: https://vk.com/zaruba72champ
#       retrieved_at: "2026-10-24"
#       trust: official
#
# Пример цитаты того же кадра: вместо `license` —
#     author: Имя Фотографа
#     use: citation
#     purpose: info
# `source` уже указан и на странице он подписан «источник заимствования».
#
# Подсказку с готовыми полями печатает `tools/prepare_photos.py --check`.

