# FAQ (`docs/06` §6.15): 12 вопросов в четырёх группах.
# Правило проекта: если ответа нет в публичных источниках — так и написано,
# со ссылкой на официальный канал. Статус `confirmed` ставится только там,
# где факт подтверждён (например, даты и формат выпуска).
items:
  - slug: skolko-stoit
    group: spectator
    status: unconfirmed
    source_id: kassy-event
    question: Сколько стоит билет?
    answer: >-
      Цены на выпуск 2025 в открытых источниках не опубликованы: на странице
      события «Касс Ру» сейчас нет актуальных мероприятий. Диапазоны «примерно»
      мы не пишем — точная цена появится в официальном анонсе, и тогда мы
      поставим её со ссылкой и датой проверки.

  - slug: s-rebenkom
    group: spectator
    status: confirmed
    source_id: kassy-event
    question: Можно ли прийти с ребёнком?
    answer: >-
      Возрастной ценз события — 6+, это метка официальной афиши. Отдельных
      детских билетов и правил сопровождения в открытых источниках нет:
      уточняйте у организаторов и площадки.

  - slug: mozhno-snimat
    group: spectator
    status: unconfirmed
    question: Можно ли снимать видео и фотографировать?
    answer: >-
      Правила съёмки, вспышки и штативов публично не описаны. Обычно залы
      просят не мешать соседям и не использовать вспышку во время номеров.
      Клипы участников на этом сайте появятся только с их согласия.

  - slug: skolko-idet
    group: spectator
    status: confirmed
    source_id: kassy-event
    question: Сколько идёт чемпионат?
    answer: >-
      Два дня: 6 декабря — соло и дуэты, 7 декабря — команды, мини-группы и шоу.
      Это подтверждённый формат 2025 года. Точное время блоков смотрите в
      расписании: до публикации «Положения» сетка помечена как демонстрационная.

  - slug: kak-zayavitsya
    group: participant
    status: unconfirmed
    source_id: vk-community
    question: Как подать заявку на участие?
    answer: >-
      Публичной формы заявки нет: организаторы собирают её в своём канале.
      Мы не принимаем заявки и не берём данные — следите за сообществом
      «ЗАРУБА72» во ВКонтакте, там публикуют условия и сроки.

  - slug: chto-vzyat
    group: participant
    status: unconfirmed
    question: Что взять с собой?
    answer: >-
      Официального списка вещей нет. Обычно это сменная обувь, вода, трек на
      носителе (если его не сдали заранее) и костюм номера. Точные требования
      появятся вместе с «Положением».

  - slug: gde-sdavat-muzyku
    group: participant
    status: unconfirmed
    question: Куда сдавать музыку для выступления?
    answer: >-
      Публично не описано. Правило простое: трек сдают заранее по инструкции
      организатора, а не приносят на флешке за минуту до выхода. Актуальный
      способ сдачи — в официальном сообществе.

  - slug: s-kakogo-vozrasta
    group: parent
    status: unconfirmed
    question: С какого возраста можно участвовать?
    answer: >-
      В сетке номинаций три возрастные группы: 6–11, 12–17 и 18+. Она ещё
      демонстрационная, а минимальный возраст допуска определяет «Положение»,
      которое не опубликовано. Поэтому мы не называем «от 6 лет» как факт.

  - slug: nuzhno-li-ryadom
    group: parent
    status: unconfirmed
    question: Нужно ли быть рядом с ребёнком в зале?
    answer: >-
      Правил сопровождения в открытых источниках нет. Уточняйте у организаторов:
      на чемпионатах такое обычно зависит от возраста и номинации. Ребёнок
      младше 18 лет без согласия на этом сайте публикуется только инициалами.

  - slug: mozhno-zabrat-ranshe
    group: parent
    status: unconfirmed
    question: Можно ли забрать ребёнка раньше?
    answer: >-
      Публично это не описано. По опыту площадки вход и выход обычно свободные,
      но участника могут вызывать на сцену в любом порядке. Договоритесь с
      организатором заранее, если уходить нужно раньше.

  - slug: kto-vy
    group: site
    status: confirmed
    question: Кто вы и почему сайт неофициальный?
    answer: >-
      Сайт делают фанаты чемпионата, а не организаторы. Мы не продаём билеты,
      не принимаем деньги и не выступаем от имени «ЗАРУБЫ». Все факты собраны
      из публичных источников и помечены статусом; официальные анонсы — в
      сообществе «ЗАРУБА72».

  - slug: kak-ispravit
    group: site
    status: confirmed
    source_id: vk-community
    question: Как исправить или удалить данные о себе?
    answer: >-
      Напишите в сообщество «ЗАРУБА72» — это быстрый канал связи. Мы исправим
      имя, студию или удалим страницу и укажем источник правки. Для страниц
      несовершеннолетних удаление — безусловное.
