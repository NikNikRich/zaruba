# FAQ (`docs/06` §6.15): 12 вопросов в четырёх группах.
# Правило проекта: если ответа нет в публичных источниках — так и написано,
# со ссылкой на официальный канал. Статус `confirmed` ставится только там,
# где факт подтверждён (например, даты и формат выпуска).
items:
  - slug: skolko-stoit
    group: spectator
    status: confirmed
    source_id: kassy-organizer
    question: Сколько стоит билет?
    answer: >-
      На выпуск 2026 цены объявлены: 12 декабря — 1000 ₽, 13 декабря — 1000 ₽
      за детский блок, 1000 ₽ за взрослый (в «Положении» — 800 ₽, но касса
      продаёт за 1000 ₽) и 1600 ₽ за весь день. Билет на оба дня стоит 1800 ₽.
      Продажи идут через официальный канал организатора, а не через этот сайт.

  - slug: s-rebenkom
    group: spectator
    status: confirmed
    source_id: kassy-organizer
    question: Можно ли прийти с ребёнком?
    answer: >-
      На афише 2026 года указан ценз 6+ — метка на странице организатора на
      «Кассах Ру»; в «Положении» возрастного рейтинга нет. В сетке есть
      номинации с трёх лет (БЕЙБИ 3–6), но это про участников, а не про
      зрителей. Детские билеты и правила сопровождения уточняйте у организаторов.

  - slug: mozhno-snimat
    group: spectator
    status: unconfirmed
    question: Можно ли снимать видео и фотографировать?
    answer: >-
      Правила съёмки, вспышки и штативов публично не описаны. Обычно залы
      просят не мешать соседям и не использовать вспышку во время номеров.
      Клипы участников на этом сайте появятся только с их согласия.

  - slug: skolko-idet
    group: spectator
    status: confirmed
    source_id: kassy-organizer
    question: Сколько идёт чемпионат?
    answer: >-
      Два дня: 12 декабря — мастер-классы, соло, дуэты и мини-группы, начало
      в 17:00; 13 декабря — команды, два блока с 09:30 до 21:00, взрослый блок
      начинается в 14:30. Время — с афиши организатора; порядок выходов внутри
      блоков не опубликован, поэтому выдуманной сетки на сайте нет.

  - slug: kak-zayavitsya
    group: participant
    status: confirmed
    source_id: registration-form
    question: Как подать заявку на участие?
    answer: >-
      Через официальную Google-форму организаторов: на 18.11.2026 в ней остались
      только командные номинации — соло и дуэты закрыты (в форме так и написано:
      «НОМИНАЦИИ СОЛО ЗАКРЫТЫ»). Приём до 07.12.2026, могут закрыть раньше при
      наборе лимита; взнос возвращают до окончания регистрации. Мы не принимаем
      заявки и не берём данные — форма ведёт к организаторам.

  - slug: chto-vzyat
    group: participant
    status: confirmed
    source_id: polozhenie-2026
    question: Что взять с собой?
    answer: >-
      Документ участника (в детских номинациях проверяют 12–13 декабря), флешку
      с треком — даже если фонограмма отправлена заранее, — и костюм номера.
      Реквизит согласуют не позднее чем за неделю до выступления.

  - slug: gde-sdavat-muzyku
    group: participant
    status: confirmed
    source_id: polozhenie-2026
    question: Куда сдавать музыку для выступления?
    answer: >-
      MP3 или WAV на zaruba72champ@mail.ru до 07.12.2026. Имя файла —
      «номинация_команда.mp3», в письме укажите команду, номинацию и «с точки /
      закулисье». Флешка с треком всё равно нужна с собой: без фонограммы в срок
      возможна дисквалификация без возврата взноса.

  - slug: s-kakogo-vozrasta
    group: parent
    status: confirmed
    source_id: polozhenie-2026
    question: С какого возраста можно участвовать?
    answer: >-
      С трёх лет: в «Положении 2026» есть номинация БЕЙБИ 3–6 лет. Дальше идут
      7–11, 12–14, 15–17 и 18+, а также соло 10–15 и мини-группы 15+. В команде
      минимум шесть человек, в мини-группе — от трёх до пяти.

  - slug: nuzhno-li-ryadom
    group: parent
    status: unconfirmed
    question: Нужно ли быть рядом с ребёнком в зале?
    answer: >-
      Правил сопровождения в открытых источниках нет. Уточняйте у организаторов:
      на чемпионатах такое обычно зависит от возраста и номинации. Ребёнок
      младше 18 лет без согласия на этом сайте публикуется только инициалами.

  - slug: mozhno-zabrat-ranshe
    group: parent
    status: unconfirmed
    question: Можно ли забрать ребёнка раньше?
    answer: >-
      Публично это не описано. По опыту площадки вход и выход обычно свободные,
      но участника могут вызывать на сцену в любом порядке. Договоритесь с
      организатором заранее, если уходить нужно раньше.

  - slug: kto-vy
    group: site
    status: confirmed
    question: Кто вы и почему сайт неофициальный?
    answer: >-
      Сайт делают фанаты чемпионата, а не организаторы. Мы не продаём билеты,
      не принимаем деньги и не выступаем от имени «ЗАРУБЫ». Все факты собраны
      из публичных источников и помечены статусом; официальные анонсы — в
      сообществе «ЗАРУБА72».

  - slug: kak-ispravit
    group: site
    status: confirmed
    question: Как исправить или удалить данные о себе?
    answer: >-
      Напишите в сообщество «ЗАРУБА72» — это быстрый канал связи. Мы исправим
      имя, студию или удалим страницу и укажем источник правки. Для страниц
      несовершеннолетних удаление — безусловное.
