# Демонстрационные рекламные офферы для показа руководству (docs/07 §7.8).
#
# Файл читается только при ZARUBA_PREVIEW_ENABLED=1 и только если для слота
# нет действующего оффера в боевом content/offers.yaml. Боевой файл остаётся
# пустым: выдуманный erid не должен попадать в публичный контент.
#
# erid с префиксом DEMO — не маркировка ОРД, а пометка «пример». В боевом
# контенте такой токен недопустим; здесь он не публикуется, потому что режим
# preview закрыт от индексации и включается вручную.
#
# Домены .example зарезервированы RFC 2606 и не существуют в сети: переход
# по CTA на показе не уводит на чужой сайт.
